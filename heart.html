<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ibrahim ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #ffd6e7;
      font-family: Arial, sans-serif;
      position: relative;
    }

    /* القلوب الموجودة بالخلفية */
    .background-heart {
      position: absolute;
      color: rgba(255, 80, 140, 0.25);
      font-size: 25px;
      animation: float 6s infinite ease-in-out;
      user-select: none;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(-10deg);
      }

      50% {
        transform: translateY(-30px) rotate(10deg);
      }
    }

    /* منطقة الأنيميشن */
    .container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 420px;
      height: 420px;
    }

    /* القلب المصغر */
    .mini-heart {
      position: absolute;
      color: #ff3f7f;
      font-size: 14px;
      opacity: 0;
      transform: scale(0);
      animation: appear 0.5s forwards;
      text-shadow: 0 0 8px rgba(255, 0, 100, 0.4);
    }

    @keyframes appear {
      0% {
        opacity: 0;
        transform: scale(0);
      }

      70% {
        opacity: 1;
        transform: scale(1.4);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* الاسم */
    .name {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      color: #d91b61;
      font-size: 65px;
      font-weight: bold;
      letter-spacing: 5px;
      opacity: 0;
      text-shadow:
        0 0 10px #fff,
        0 0 20px #ff80aa,
        0 0 35px #ff4f91;
      animation: nameAppear 2s ease forwards;
      animation-delay: 5.5s;
    }

    @keyframes nameAppear {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0);
      }

      60% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.15);
      }

      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* نبض الاسم */
    .name::after {
      content: "❤️";
      position: absolute;
      font-size: 25px;
      right: 30px;
      top: -15px;
    }

    @media (max-width: 500px) {
      .container {
        width: 320px;
        height: 320px;
      }

      .name {
        font-size: 48px;
      }

      .mini-heart {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <!-- قلوب الخلفية -->
  <div class="background-heart" style="left: 8%; top: 15%; animation-delay: 0s;">❤️</div>
  <div class="background-heart" style="left: 20%; top: 70%; animation-delay: 1s;">💕</div>
  <div class="background-heart" style="left: 80%; top: 20%; animation-delay: 2s;">💗</div>
  <div class="background-heart" style="left: 90%; top: 75%; animation-delay: 0.5s;">❤️</div>
  <div class="background-heart" style="left: 50%; top: 10%; animation-delay: 1.5s;">💖</div>
  <div class="background-heart" style="left: 5%; top: 45%; animation-delay: 2.5s;">💗</div>
  <div class="background-heart" style="left: 72%; top: 55%; animation-delay: 3s;">💕</div>
  <div class="background-heart" style="left: 35%; top: 85%; animation-delay: 1s;">❤️</div>

  <div class="container" id="heartContainer">
    <div class="name">Ibrahim</div>
  </div>

  <script>
    const container = document.getElementById("heartContainer");

    /*
      معادلة القلب:
      x = 16 sin³(t)
      y = 13 cos(t) - 5 cos(2t) - 2 cos(3t) - cos(4t)
    */

    const totalHearts = 150;

    for (let i = 0; i < totalHearts; i++) {

      const t = (Math.PI * 2 * i) / totalHearts;

      const x =
        16 * Math.pow(Math.sin(t), 3);

      const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

      // تكبير القلب
      const scale = 11;

      const heart = document.createElement("span");

      heart.className = "mini-heart";
      heart.innerHTML = "♥";

      heart.style.left =
        (210 + x * scale) + "px";

      heart.style.top =
        (205 - y * scale) + "px";

      // تأخير ظهور كل قلب
      heart.style.animationDelay =
        (i * 0.035) + "s";

      // أحجام وألوان مختلفة قليلاً
      heart.style.fontSize =
        (10 + Math.random() * 8) + "px";

      const colors = [
        "#ff2f75",
        "#ff4f91",
        "#e91e63",
        "#ff6699",
        "#d81b60"
      ];

      heart.style.color =
        colors[Math.floor(Math.random() * colors.length)];

      container.appendChild(heart);
    }

    // قلوب صغيرة إضافية تظهر حول الصفحة
    function createFloatingHeart() {
      const heart = document.createElement("div");

      heart.innerHTML = ["❤️", "💕", "💗", "💖"][
        Math.floor(Math.random() * 4)
      ];

      heart.style.position = "absolute";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.top = "105vh";
      heart.style.fontSize = (15 + Math.random() * 20) + "px";
      heart.style.opacity = "0.6";
      heart.style.pointerEvents = "none";

      document.body.appendChild(heart);

      const duration = 5 + Math.random() * 5;

      heart.animate(
        [
          {
            transform: "translateY(0) rotate(0deg)",
            opacity: 0
          },
          {
            transform: "translateY(-50vh) rotate(20deg)",
            opacity: 0.7
          },
          {
            transform: "translateY(-110vh) rotate(-20deg)",
            opacity: 0
          }
        ],
        {
          duration: duration * 1000,
          easing: "linear"
        }
      );

      setTimeout(() => {
        heart.remove();
      }, duration * 1000);
    }

    setInterval(createFloatingHeart, 700);
  </script>

</body>
</html>
